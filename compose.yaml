services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    command: start-dev --http-port=8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: INFO,com.aruba.simpl:DEBUG
    ports:
      - "8080:8080"
    volumes:
      - ./target/keycloak-terms-and-conditions-1.0.0-SNAPSHOT.jar:/opt/keycloak/providers/keycloak-terms-and-conditions.jar:ro
      - keycloak-data:/opt/keycloak/data

volumes:
  keycloak-data:
